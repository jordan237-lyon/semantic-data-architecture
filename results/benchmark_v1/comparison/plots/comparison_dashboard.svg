<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="800" viewBox="0 0 1150 800" role="img" aria-labelledby="title desc">
<title id="title">Baseline vs architecture sémantique</title>
<desc id="desc">Tableau de bord comparant qualité, erreurs, performance et effort.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<style>text{font-family:Arial,sans-serif;fill:#172033}.title{font-size:25px;font-weight:700}.subtitle{font-size:14px;fill:#667085}.heading{font-size:17px;font-weight:700}.label{font-size:13px;font-weight:600}.small{font-size:12px;fill:#667085}.value{font-size:13px;font-weight:700}.big{font-size:29px;font-weight:700}</style>
<text x="575" y="38" text-anchor="middle" class="title">Baseline vs architecture sémantique</text>
<text x="575" y="64" text-anchor="middle" class="subtitle">Même environnement · mêmes données · même vérité terrain</text>
<text x="150" y="128" text-anchor="middle" class="big">+0.017</text>
<text x="150" y="151" text-anchor="middle" class="small">gain absolu de F1</text>
<text x="430" y="128" text-anchor="middle" class="big">9 → 0</text>
<text x="430" y="151" text-anchor="middle" class="small">faux positifs</text>
<text x="720" y="128" text-anchor="middle" class="big">× 5.76</text>
<text x="720" y="151" text-anchor="middle" class="small">temps médian</text>
<text x="1000" y="128" text-anchor="middle" class="big">2</text>
<text x="1000" y="151" text-anchor="middle" class="small">validations humaines</text>
<text x="300" y="220" text-anchor="middle" class="heading">Qualité globale</text>
<text x="850" y="220" text-anchor="middle" class="heading">Effort par intégration</text>
<text x="115" y="275" class="label">Précision</text>
<line x1="210" y1="261" x2="518.9" y2="261" stroke="#64748b" stroke-width="13"/>
<text x="550" y="265" class="small">0.965</text>
<line x1="210" y1="281" x2="530.0" y2="281" stroke="#2563eb" stroke-width="13"/>
<text x="550" y="285" class="small">1.000</text>
<text x="115" y="365" class="label">Rappel</text>
<line x1="210" y1="351" x2="516.6" y2="351" stroke="#64748b" stroke-width="13"/>
<text x="550" y="355" class="small">0.958</text>
<line x1="210" y1="371" x2="516.6" y2="371" stroke="#2563eb" stroke-width="13"/>
<text x="550" y="375" class="small">0.958</text>
<text x="115" y="455" class="label">F1</text>
<line x1="210" y1="441" x2="517.7" y2="441" stroke="#64748b" stroke-width="13"/>
<text x="550" y="445" class="small">0.962</text>
<line x1="210" y1="461" x2="523.1" y2="461" stroke="#2563eb" stroke-width="13"/>
<text x="550" y="465" class="small">0.979</text>
<text x="680" y="265" class="label">Mappings manuels baseline</text>
<rect x="890" y="247" width="150.0" height="24" fill="#64748b"/>
<text x="1050.0" y="265" class="value">19</text>
<text x="680" y="332" class="label">Règles manuelles baseline</text>
<rect x="890" y="314" width="71.1" height="24" fill="#64748b"/>
<text x="971.1" y="332" class="value">9</text>
<text x="680" y="399" class="label">Mappings automatiques</text>
<rect x="890" y="381" width="134.2" height="24" fill="#2563eb"/>
<text x="1034.2" y="399" class="value">17</text>
<text x="680" y="466" class="label">Validations humaines</text>
<rect x="890" y="448" width="15.8" height="24" fill="#f59e0b"/>
<text x="915.8" y="466" class="value">2</text>
<line x1="75" y1="590" x2="1075" y2="590" stroke="#d8dee9"/>
<text x="575" y="635" text-anchor="middle" class="heading">Compromis observé</text>
<text x="575" y="672" text-anchor="middle" class="label">La sémantique élimine les 9 associations incorrectes et améliore le F1,</text>
<text x="575" y="698" text-anchor="middle" class="label">mais demande 2 validations et un temps médian multiplié par 5.76.</text>
<text x="575" y="752" text-anchor="middle" class="subtitle">Le coût initial du modèle sémantique est comptabilisé séparément de l’effort par source.</text>
</svg>