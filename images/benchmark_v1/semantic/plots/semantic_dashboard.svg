<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" role="img" aria-labelledby="title desc">
<title id="title">Matching sémantique — synthèse des décisions</title>
<desc id="desc">Tableau de bord montrant dix-neuf colonnes, dix-sept acceptations et deux validations humaines.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<style>text{font-family:Arial,sans-serif;fill:#172033}.title{font-size:25px;font-weight:700}.subtitle{font-size:14px;fill:#667085}.heading{font-size:17px;font-weight:700}.label{font-size:13px;font-weight:600}.small{font-size:12px;fill:#667085}.value{font-size:13px;font-weight:700}.big{font-size:30px;font-weight:700}</style>
<text x="550" y="38" text-anchor="middle" class="title">Matching sémantique — synthèse des décisions</text>
<text x="550" y="64" text-anchor="middle" class="subtitle">Politique fondée sur le score du meilleur candidat et sa marge</text>
<text x="165" y="128" text-anchor="middle" class="big">19</text>
