<rect x="905.3" y="232" width="94.7" height="38" fill="#f59e0b"/>
<text x="952.6" y="257" text-anchor="middle" font-size="13" font-weight="700" fill="white">2</text>
<rect x="350" y="288" width="15" height="15" fill="#16a34a"/>
