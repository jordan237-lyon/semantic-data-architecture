<text x="130" y="400" class="label">CRM</text>
<rect x="220.0" y="378" width="300.0" height="30" fill="#16a34a"/>
<text x="370.0" y="399" text-anchor="middle" font-size="12" font-weight="700" fill="white">5</text>
<rect x="520.0" y="378" width="60.0" height="30" fill="#f59e0b"/>
<text x="550.0" y="399" text-anchor="middle" font-size="12" font-weight="700" fill="white">1</text>
<text x="130" y="462" class="label">SUPPORT</text>
<rect x="220.0" y="440" width="300.0" height="30" fill="#16a34a"/>
<text x="370.0" y="461" text-anchor="middle" font-size="12" font-weight="700" fill="white">5</text>
<rect x="520.0" y="440" width="60.0" height="30" fill="#f59e0b"/>
<text x="550.0" y="461" text-anchor="middle" font-size="12" font-weight="700" fill="white">1</text>
