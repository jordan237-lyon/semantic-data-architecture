<text x="185" y="335" text-anchor="end" class="heading">Total</text>
<rect x="210" y="316" width="534.7" height="28" fill="#f59e0b"/>
<text x="756.7" y="335" class="value">0.862</text>
<text x="475" y="485" text-anchor="middle" class="heading">Le score est suffisant, mais la marge impose une validation</text>
<text x="300" y="530" text-anchor="middle" class="big">0.862</text>
<text x="300" y="555" text-anchor="middle" class="small">score total ≥ 0,85</text>
